name: Azahar Windows Qt

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
    azahar_version: 2126.2
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
   
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Download source code
        shell: cmd
        run: |
          git clone --branch ${{env.azahar_version}} https://github.com/azahar-emu/azahar
          echo "Listing root folder..."
          dir azahar
          echo "Listing externals folder..."
          dir azahar/externals
          armdir /s azahar/externals/cubeb
