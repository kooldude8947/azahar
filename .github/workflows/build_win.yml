name: Azahar Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
   
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7          
      - name: Install extra tools
        run: choco install ccache ninja ptime wget

      - name: Install Vulkan-SDK
        run: |
          wget https://sdk.lunarg.com/sdk/download/1.4.304.1/windows/VulkanSDK-1.4.304.1-Installer.exe -O D:/a/_temp/vulkan.exe
          D:/a/_temp/vulkan.exe --accept-licenses --default-answer --confirm-command install

      - name: Install NSIS
        run: |
          wget https://download.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11-setup.exe -O D:/a/_temp/nsis-setup.exe
          ptime D:/a/_temp/nsis-setup.exe /S
          
      - name: Download source code
        run: |
          git clone --branch 2126.2 --recurse-submodules https://github.com/azahar-emu/azahar
          git clone https://github.com/${{ github.repository_owner }}/Qt-Win-Static

      - name: Copy modified source code to original folders
        shell: cmd
        run: xcopy /q /s /x /y ${{ github.workspace }}\newsrc ${{ github.workspace }}\azahar

      - name: Disable line ending translation
        run: git config --global core.autocrlf input
        
      - name: Build
        working-directory: ${{github.workspace}}\azahar
        shell: cmd
        run: |
          mkdir build && cd build
          cmake .. -G Ninja ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_C_COMPILER_LAUNCHER=ccache ^
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ^
          -DENABLE_DISCORD_RPC=OFF ^
          -DENABLE_WEB_SERVICE=OFF ^
          -DENABLE_SCRIPTING=OFF ^
          -DENABLE_GDBSTUB=OFF ^
          -DENABLE_QT=OFF ^
          -DENABLE_QT_TRANSLATION=OFF ^
          -DENABLE_QT_UPDATE_CHECKER=OFF ^
          -DUSE_DISCORD_PRESENCE=OFF ^
          "${EXTRA_CMAKE_FLAGS[@]}"
          ninja
          ninja bundle
          strip -s bundle/*.exe
          
          ccache -s -v
          ctest -VV -C Release || echo "::error ::Test error occurred on Windows build"
        
      - name: Generate installer
        working-directory: ${{github.workspace}}\azahar
        shell: cmd
        run: |
          cd src\installer
          "C:\Program Files (x86)\NSIS\makensis.exe" /DPRODUCT_VARIANT=msvc /DPRODUCT_VERSION=${{ github.ref_name }} citra.nsi
          mkdir ..\..\artifacts 2> NUL
          move /y *.exe ..\..\artifacts\

      - name: Pack
        working-directory: ${{github.workspace}}\azahar
        run: .ci/pack.sh

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-msvc
          path: artifacts/
          
      - name: List dir
        shell: cmd
        run: dir /S "${{ github.workspace }}\azahar\build"
