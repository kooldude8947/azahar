name: Azahar Windows Qt

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
    azahar_version: 2126.2
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
   
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Install extra tools
        run: choco install ccache ptime wget

      - name: Install Vulkan-SDK
        run: |
          wget https://sdk.lunarg.com/sdk/download/1.4.304.1/windows/VulkanSDK-1.4.304.1-Installer.exe -O D:/a/_temp/vulkan.exe
          D:/a/_temp/vulkan.exe --accept-licenses --default-answer --confirm-command install

      - name: Install NSIS
        run: |
          wget https://download.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11-setup.exe -O D:/a/_temp/nsis-setup.exe
          ptime D:/a/_temp/nsis-setup.exe /S
          
      - name: Download source code
        run: |
          git clone --branch ${{env.azahar_version}} --recurse-submodules https://github.com/azahar-emu/azahar
          git clone https://github.com/${{ github.repository_owner }}/Qt-Win-Shared

      - name: Copy modified source code to original folders
        shell: cmd
        run: xcopy /h /q /s /x /y ${{ github.workspace }}\newsrc ${{ github.workspace }}\azahar

      - name: Disable line ending translation
        run: git config --global core.autocrlf input

      - uses: azahar-emu/msvc-dev-cmd@v1
      - name: Build
        working-directory: ${{github.workspace}}\azahar
        shell: cmd
        run: |
          mkdir build
          cmake -S . -B build -G Ninja ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_C_COMPILER_LAUNCHER=ccache ^
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ^
          -DENABLE_DISCORD_RPC=ON ^
          -DENABLE_WEB_SERVICE=ON ^
          -DENABLE_SCRIPTING=ON ^
          -DENABLE_GDBSTUB=ON ^
          -DENABLE_QT=ON ^
          -DENABLE_QT_TRANSLATION=ON ^
          -DENABLE_QT_UPDATE_CHECKER=ON ^
          -DQt5_DIR=${{github.workspace}}\Qt-Win-Shared\Qt\Qt-5.15.19\lib\cmake\Qt5 ^
          -DUSE_SYSTEM_QT=ON ^
          -DUSE_DISCORD_PRESENCE=ON
          cd build
          ninja
          ninja bundle
          strip -s bundle/*.exe

      - name: Copy extra files
        env:
          openssl_location: C:\Program Files\OpenSSL
        working-directory: ${{github.workspace}}\azahar
        shell: cmd
        run: |
          copy /y /v "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\14.44.35112\x64\Microsoft.VC143.CRT\msvcp140.dll" build\bundle
          copy "${{ env.openssl_location }}\bin\libcrypto-3-x64.dll" build\bundle
          copy "${{ env.openssl_location }}\bin\libssl-3-x64.dll" build\bundle
          
      - name: Generate installer
        working-directory: ${{github.workspace}}\azahar
        shell: cmd
        run: |
          cd src\installer
          "C:\Program Files (x86)\NSIS\makensis.exe" /DPRODUCT_VARIANT=msvc /DPRODUCT_VERSION=${{env.azahar_version}} citra.nsi
          move /y *.exe ..\..\build\bundle\
          
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-msvc
          path: ${{github.workspace}}\azahar\build\bundle
